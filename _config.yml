# -----------------------------------------------------------------------------
# al-folio site configuration — chansigit.github.io
# Replace any "TODO" placeholders with real values, then `bundle exec jekyll serve`
# locally or push to chansigit.github.io for live deployment.
# -----------------------------------------------------------------------------

title: Sijie Chen
first_name: Sijie
middle_name:
last_name: Chen

email: chensj16@stanford.edu
description: >
  Postdoctoral scholar at Stanford. Machine learning for biological discovery
  — representation learning, generative models, optimal transport,
  cross-domain alignment.
footer_text: >
  Powered by <a href="https://jekyllrb.com/" target="_blank">Jekyll</a>
  with the <a href="https://github.com/alshedivat/al-folio" target="_blank">al-folio</a> theme.
keywords: machine learning, representation learning, optimal transport, single-cell genomics, generative models, foundation models

lang: en
icon: 🧬
url: https://chansigit.github.io
baseurl: ""

last_updated: true

# -----------------------------------------------------------------------------
# RSS feed
# -----------------------------------------------------------------------------
rss_icon: true

# -----------------------------------------------------------------------------
# Open Graph & SEO
# -----------------------------------------------------------------------------
serve_og_meta: true
serve_schema_org: true
og_image:

# -----------------------------------------------------------------------------
# Layout: academic minimal
# -----------------------------------------------------------------------------
navbar_fixed: true
footer_fixed: false

# Display the social icons in the about page
social: true

# Maximum width of the content (default 800px)
max_width: 920px

# -----------------------------------------------------------------------------
# Theme colours (override al-folio defaults — academic minimal)
# Light mode: white bg, near-black text, deep magenta accent matching the CV.
# Drop the magenta and uncomment the navy block below if you'd prefer a calmer
# accent.
# -----------------------------------------------------------------------------
back_to_top: true
enable_progressbar: true
enable_darkmode: true

# -----------------------------------------------------------------------------
# Profile
# -----------------------------------------------------------------------------
# Drop a square headshot photo into assets/img/prof_pic.jpg (or .png).
# 600x600 is a good size.

# -----------------------------------------------------------------------------
# Pages — which ones to render
# -----------------------------------------------------------------------------
display_external_services: true

# -----------------------------------------------------------------------------
# News
# -----------------------------------------------------------------------------
news:                   true
news_limit:             5
news_scrollable:        true

# -----------------------------------------------------------------------------
# Selected papers (on the homepage)
# -----------------------------------------------------------------------------
selected_papers:        true

# -----------------------------------------------------------------------------
# Social integration
# -----------------------------------------------------------------------------
github_username:        chansigit
linkedin_username:      sijie-chen-94ab1a308
scholar_userid:         bhseUuYAAAAJ
publons_id:
research_gate_profile:
work_email:             chensj16@stanford.edu
contact_note: >
  Best way to reach me is email. For collaborations, please include a short
  problem description and a pointer to any relevant data.

orcid_id:
semanticscholar_id:
osf_id:
google_analytics:

# -----------------------------------------------------------------------------
# Bibliography settings
# -----------------------------------------------------------------------------
scholar:

  last_updated: false
  style: apa
  locale: en

  sort_by: year
  order: descending

  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib

  replace_strings: true
  join_strings:    true

  details_dir:    bibliography
  details_layout: bibtex.html
  details_link:   Details

  query: "@*"

# -----------------------------------------------------------------------------
# Jekyll / build settings
# -----------------------------------------------------------------------------
markdown:      kramdown
highlighter:   rouge
permalink:     /blog/:year/:title/

kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class:    'highlight'
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line:   1

include:
  - _pages

exclude:
  - bin
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md

keep_files:
  - CNAME
  - .nojekyll
  - .git

plugins:
  - jekyll-archives
  - jekyll-diagrams
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-imagemagick
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-paginate-v2
  - jekyll-scholar
  - jekyll-sitemap
  - jekyll-target-blank
  - jekyll-twitter-plugin
  - jemoji

# -----------------------------------------------------------------------------
# Pagination
# -----------------------------------------------------------------------------
pagination:
  enabled:      true
  collection:   posts
  permalink:    /page/:num/
  per_page:     5
  sort_field:   date
  sort_reverse: true
  trail:
    before:     1
    after:      3

# -----------------------------------------------------------------------------
# Optional Collections (projects, news)
# -----------------------------------------------------------------------------
collections:
  news:
    defaults:
      layout: post
    output: true
    permalink: /news/:path/
  projects:
    output: true
    permalink: /projects/:path/

# -----------------------------------------------------------------------------
# Asset compression / minification
# -----------------------------------------------------------------------------
jekyll-minifier:
  uglifier_args:
    harmony: true
