<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" font-family="IBM Plex Sans, system-ui, sans-serif">
  <title>Two roads to a plasmacytoid dendritic cell</title>
  <desc>Normally the CD115-negative progenitor makes pDCs through the Flt3L route. Without p38 alpha that road is blocked, and the CD115-positive progenitor makes pDCs through the M-CSF route instead, producing cells that cannot make interferons or IL-12.</desc>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#008080"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#b3261e"/>
    </marker>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#9fb0b0"/>
    </marker>
  </defs>
  <rect width="1000" height="420" fill="#ffffff"/>

  <text x="26" y="40" font-size="23" font-weight="600" fill="#1a2e30">With p38&#945;</text>
  <g>
    <rect x="26" y="62" width="196" height="62" rx="10" fill="#ffffff" stroke="#9fb0b0" stroke-width="2"/>
    <text x="124" y="88" text-anchor="middle" font-size="19" fill="#1a2e30">CD115&#8722; progenitor</text>
    <text x="124" y="111" text-anchor="middle" font-size="17" fill="#556b6c">the pDC road</text>

    <line x1="230" y1="93" x2="406" y2="93" stroke="#008080" stroke-width="3" marker-end="url(#a1)"/>
    <text x="318" y="78" text-anchor="middle" font-size="18" fill="#008080">Flt3L</text>

    <rect x="416" y="62" width="180" height="62" rx="10" fill="#008080"/>
    <text x="506" y="99" text-anchor="middle" font-size="21" font-weight="600" fill="#ffffff">pDCs</text>

    <text x="620" y="87" font-size="19" fill="#1a2e30">Right numbers,</text>
    <text x="620" y="112" font-size="19" fill="#1a2e30">and they work.</text>

    <rect x="26" y="146" width="196" height="50" rx="10" fill="#f2f8f7" stroke="#d3dfde"/>
    <text x="124" y="177" text-anchor="middle" font-size="19" fill="#9fb0b0">CD115&#43; progenitor</text>
    <line x1="230" y1="171" x2="406" y2="171" stroke="#c6d0d0" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#a3)"/>
    <text x="318" y="157" text-anchor="middle" font-size="18" fill="#b9c6c6">mostly cDCs</text>
    <rect x="416" y="146" width="180" height="50" rx="10" fill="#f2f8f7" stroke="#d3dfde"/>
    <text x="506" y="177" text-anchor="middle" font-size="19" fill="#9fb0b0">cDCs</text>
  </g>

  <line x1="26" y1="228" x2="974" y2="228" stroke="#d3dfde" stroke-width="2"/>

  <text x="26" y="268" font-size="23" font-weight="600" fill="#1a2e30">Without p38&#945;</text>
  <g>
    <rect x="26" y="290" width="196" height="50" rx="10" fill="#f2f8f7" stroke="#d3dfde"/>
    <text x="124" y="321" text-anchor="middle" font-size="19" fill="#9fb0b0">CD115&#8722; progenitor</text>
    <line x1="230" y1="315" x2="330" y2="315" stroke="#c6d0d0" stroke-width="3"/>
    <line x1="338" y1="300" x2="368" y2="330" stroke="#b3261e" stroke-width="4"/>
    <line x1="368" y1="300" x2="338" y2="330" stroke="#b3261e" stroke-width="4"/>
    <text x="353" y="356" text-anchor="middle" font-size="17" fill="#b3261e">road blocked</text>

    <rect x="26" y="366" width="196" height="0" fill="none"/>

    <rect x="26" y="188" width="0" height="0" fill="none"/>
  </g>
  <g>
    <rect x="416" y="282" width="196" height="62" rx="10" fill="#ffffff" stroke="#008080" stroke-width="2"/>
    <text x="514" y="308" text-anchor="middle" font-size="19" fill="#1a2e30">CD115&#43; progenitor</text>
    <text x="514" y="331" text-anchor="middle" font-size="17" fill="#008080">receptor piles up</text>
    <line x1="620" y1="313" x2="716" y2="313" stroke="#008080" stroke-width="3" marker-end="url(#a1)"/>
    <text x="668" y="298" text-anchor="middle" font-size="18" fill="#008080">M-CSF</text>

    <rect x="726" y="282" width="150" height="62" rx="10" fill="#ffffff" stroke="#b3261e" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="801" y="311" text-anchor="middle" font-size="20" font-weight="600" fill="#1a2e30">pDCs</text>
    <text x="801" y="333" text-anchor="middle" font-size="16" fill="#b3261e">hollow</text>

    <text x="416" y="392" font-size="19" fill="#1a2e30">Numbers recover, but no interferons and no IL-12:</text>
    <text x="416" y="414" font-size="19" fill="#b3261e">the mice cannot prime CD8 T cells against a tumor.</text>
  </g>
</svg>
