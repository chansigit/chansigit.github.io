- title: Experience
  type: time_table
  contents:
    - title: Postdoctoral Scholar
      institution: Stanford University, Stanford, CA
      year: 2024 - present
      description:
        - >-
          <b>TransMap</b> (NeurIPS 2026 submission, first author): a discrete
          optimal-transport framework (Gromov–Wasserstein, Fused-GW with block
          coordinate descent) that re-represents scRNA-seq cells as 2D feature
          images. ~15M-parameter CNN beats parameter-matched MLPs on five
          multi-organ benchmarks; shared multi-species grid aligns cross-species
          cells without ortholog conversion.
        - >-
          <b>Dynode</b> (first author, in prep): SE(3)-equivariant transformer
          neural-ODE model that learns 3D organogenesis trajectories with
          OT-based regularisation; supports <i>in silico</i> perturbation for
          congenital heart disease.
        - >-
          Chromatin regulatory dynamics: SMARCB1 / JARID2 coordination in
          pluripotency, using the dynamics framework above with single-cell
          RNA-seq.
        - >-
          Antibody design with immune epigenomics: ATAC-seq as functional
          readout, feedback into molecular-engineering loop.
    - title: Research Assistant
      institution: Tsinghua University, Beijing
      year: 2023 - 2024
      description:
        - Continued cell-atlas and single-cell foundation-model work.
    - title: Ph.D. Researcher
      institution: Tsinghua University, Beijing
      year: 2016 - 2023
      description:
        - >-
          <b>hECA</b>: cell-centric assembly of human cell atlas (1.09M cells
          across 38 organs, 116 datasets).
        - >-
          <b>VeloFusion</b>: velocity-informed cross-batch integration via
          graph generative models.
        - >-
          Contributed to <b>scMulan</b>: 368M-parameter multitask generative
          single-cell foundation model.
        - >-
          $D_2^R$ statistic: linear-time repeat detection (Bioinformatics
          2019), with Prof. Michael S. Waterman.

